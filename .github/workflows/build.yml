name: Build .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential curl git fakeroot dpkg-dev python3

      - name: Setup Theos
        run: |
          export THEOS=/home/runner/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

      - name: Build package
        run: make package FINALPACKAGE=1 2>&1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PapaJohns-deb
          path: packages/*.deb
          if-no-files-found: error