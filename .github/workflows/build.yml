name: Build .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Официальный экшн от команды Theos — сам тянет Theos + нужный SDK,
      # кэширует между ранами, ставит THEOS и THEOS_MAKE_PATH в env.
      - name: Setup Theos
        uses: theos/theos-action@v1
        with:
          cache-key: theos

      - name: Build package
        run: make package FINALPACKAGE=1 2>&1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PapaJohns-deb
          path: packages/*.deb
          if-no-files-found: error