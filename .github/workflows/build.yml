name: Build .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # macOS runner — единственный способ получить Apple LLVM, который умеет
    # компилировать arm-apple-ios armv7/armv7s без стороннего кросс-компилятора.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS"                     >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles"  >> "$GITHUB_ENV"

      - name: Download iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"

          # Берём актуальный URL из GitHub Releases API (не угадываем тег вручную).
          # Предпочитаем iPhoneOS14.x — последний SDK с поддержкой armv7.
          ASSET_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/theos/sdks/releases/latest" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
assets = data.get('assets', [])
for a in assets:
    if 'iPhoneOS14' in a['name'] and a['name'].endswith('.tar.xz'):
        print(a['browser_download_url']); raise SystemExit
for a in assets:
    if a['name'].endswith('.tar.xz'):
        print(a['browser_download_url']); raise SystemExit
")
          echo "SDK: $ASSET_URL"
          curl -fsSL "$ASSET_URL" -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          echo "Installed: $(ls $THEOS/sdks)"

      - name: Build package
        run: make package FINALPACKAGE=1 2>&1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PapaJohns-deb
          path: packages/*.deb
          if-no-files-found: error