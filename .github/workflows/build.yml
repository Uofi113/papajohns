name: Build .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fakeroot dpkg-dev curl git xz-utils python3

      - name: Install Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git "$THEOS"
          sudo chmod -R 777 "$THEOS"
          echo "THEOS=$THEOS"                      >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles"   >> "$GITHUB_ENV"

      # Тулчейн — это отдельный репо theos/toolchain: кросс-компилятор
      # arm-apple-ios для Linux. Без него /opt/theos/toolchain/linux/iphone/bin/clang
      # не существует и сборка падает с Error 127.
      - name: Download Theos toolchain
        run: |
          TC_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/theos/toolchain/releases/latest" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
for a in data.get('assets', []):
    print(a['browser_download_url']); break
")
          echo "Toolchain URL: $TC_URL"
          curl -fsSL "$TC_URL" -o /tmp/toolchain.tar.xz
          mkdir -p "$THEOS/toolchain/linux/iphone"
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain/linux/iphone" --strip-components=1
          ls "$THEOS/toolchain/linux/iphone/bin/" | head -10

      - name: Download iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          SDK_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/theos/sdks/releases/latest" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
assets = data.get('assets', [])
# iPhoneOS14.x — последний SDK с поддержкой armv7
for a in assets:
    if 'iPhoneOS14' in a['name'] and a['name'].endswith('.tar.xz'):
        print(a['browser_download_url']); raise SystemExit
# fallback: первый .tar.xz
for a in assets:
    if a['name'].endswith('.tar.xz'):
        print(a['browser_download_url']); raise SystemExit
")
          echo "SDK URL: $SDK_URL"
          curl -fsSL "$SDK_URL" -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          echo "Installed SDKs: $(ls $THEOS/sdks)"

      - name: Build package
        run: make package FINALPACKAGE=1 2>&1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PapaJohns-deb
          path: packages/*.deb
          if-no-files-found: error